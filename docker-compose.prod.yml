# =============================================================================
# docker-compose.prod.yml — ThreatWeave Full-Stack Production Compose
# =============================================================================
# Purpose: Full-stack local verification of production images.
#   - Builds images from source Dockerfiles (no source bind-mounts)
#   - Services: api, web, postgres, chromadb, n8n (optional profile)
#   - Named volumes for data persistence
#   - Health checks on api and postgres
#
# Usage:
#   # Minimal stack (no n8n):
#   docker compose -f docker-compose.prod.yml up -d
#
#   # Full stack including n8n:
#   docker compose -f docker-compose.prod.yml --profile n8n up -d
#
# Required environment variables (copy .env.example -> .env.prod and fill in):
#   DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   GROQ_API_KEY, JWT_SECRET_KEY, CHROMA_PATH, CORS_ALLOWED_ORIGINS
# =============================================================================

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: threatweave-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatweave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-threatweave_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatweave_user} -d ${POSTGRES_DB:-threatweave_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not exposed externally in prod — only accessible within Docker network
    expose:
      - "5432"

  # ─── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: threatweave-chromadb-prod
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENT_DIR=/chroma/chroma
    volumes:
      - chromadb_data:/chroma/chroma
    expose:
      - "8000"

  # ─── API Backend ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: threatweave-api:prod
    container_name: threatweave-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Application
      ENVIRONMENT: production
      PORT: 8000

      # Database — uses internal Docker network hostname
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatweave_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-threatweave_db}

      # ChromaDB — uses internal Docker network hostname
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_PATH: /app/chroma_db

      # Storage
      STORAGE_PATH: /app/storage

      # CORS — update to your actual frontend URL in production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}

      # Auth — MUST be set to a strong secret in production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong secret}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}

      # Groq API (mandatory for LLM synthesis)
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}

      # Optional API keys (leave unset to run without them)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      URL_REPUTATION_API_KEY: ${URL_REPUTATION_API_KEY:-}

      # n8n webhook (leave unset to disable)
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_ALERT_SEVERITY_THRESHOLD: ${N8N_ALERT_SEVERITY_THRESHOLD:-high}

      # Validation limits
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-15}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-20000}
    volumes:
      # Named volumes — no source bind-mounts in prod
      - api_storage:/app/storage
      - api_chroma:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ─── Web Frontend ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Bake the API URL into the Next.js build so client-side fetches work
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: threatweave-web:prod
    container_name: threatweave-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

  # ─── n8n Workflow Automation (optional — enable with --profile n8n) ─────────
  n8n:
    profiles:
      - n8n
    image: n8nio/n8n:latest
    container_name: threatweave-n8n-prod
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
    volumes:
      - n8n_data:/home/node/.n8n

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
  chromadb_data:
    driver: local
  api_storage:
    driver: local
  api_chroma:
    driver: local
  n8n_data:
    driver: local

name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    name: API Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql://threatweave_user:testpassword123@localhost:5432/threatweave_db"
      CHROMA_PATH: "./test_chroma_ci"
      JWT_SECRET_KEY: "ci_pipeline_super_secret_jwt_key_32_chars_min"
      GROQ_API_KEY: "gsk_ci_mocked_test_key_for_pipeline_execution"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: threatweave_user
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: threatweave_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            ffmpeg \
            libsndfile1

      - name: Install Python Dependencies (CPU-Optimized)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Database Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v --maxfail=5

  web-ci:
    name: Web Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: |
          npm install

      - name: Frontend Code Quality (ESLint)
        run: |
          npm run lint

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build

  docker-sanity:
    name: Docker Container Build Sanity
    needs: [api-ci, web-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container (Dry-Run with GHA Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: threatweave-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Container (Dry-Run with GHA Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true
          tags: threatweave-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Non-Root User & Image Secrets
        run: |
          echo "Verifying API non-root user..."
          API_USER=$(docker run --rm threatweave-api:ci-test whoami)
          [ "$API_USER" = "appuser" ] || { echo "API container did not run as appuser: $API_USER"; exit 1; }

          echo "Verifying Web non-root user..."
          WEB_USER=$(docker run --rm threatweave-web:ci-test whoami)
          [ "$WEB_USER" = "nextjs" ] || { echo "Web container did not run as nextjs: $WEB_USER"; exit 1; }

          echo "Auditing API layers for baked credentials..."
          docker history --no-trunc threatweave-api:ci-test | grep -iE 'gsk_|POSTGRES_PASSWORD|JWT_SECRET_KEY' && {
            echo "LEAK DETECTED: secrets found in API image history!"; exit 1;
          } || echo "API Image history clean."

          echo "Docker verification passed successfully."
